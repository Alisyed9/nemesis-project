{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<section class="panel error-panel" role="alert">
  <div class="eyebrow">Error 404</div>
  <h1>That page is not available</h1>
  <p class="text-secondary">The resource may have moved or the address may be incorrect.</p>
  <a class="button button-primary" href="{% url 'dashboard:home' %}">Return to overview</a>
</section>
{% endblock %}
